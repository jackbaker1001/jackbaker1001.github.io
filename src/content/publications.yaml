  details: "6, 18"
  year: 2024
  type: journal
  doi: 10.1007/s42484-024-00149-0
  arxiv: "2305.05881"
  summary: A trainable time-dependent inner product space is devised using time evolution operators from quantum mechanics and used to define a time-series Hamiltonian kernel which, alongside a classical SVM, classifies time series on 127-qubit superconducting transmon chips. Kernel matrices are computed in parallel using many quantum threads spread across the chip.
  topics: [qml]

