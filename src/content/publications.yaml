  arxiv: "2210.16438"
  code: https://github.com/AgnostiqHQ/Quantum-Variational-Rewinding
  summary: We train parameterized quantum time-devolution operators to detect anomalies in cryptocurrency time series and show on IBM superconducting hardware that error mitigation reduces anomaly-score errors by as much as 14% on average.
  topics: [qml, error-mitigation]

- id: baker2025initial
