- id: salazar2026stabilizer
  title: "Stabilizer Statistical Mechanics: A Framework for Efficient Quantification and Classification of Magic States"
  authors: [W. E. Salazar, G. Saxena, J. S. Baker, L. C. Kwek, T. H. Kyaw]
  venue: arXiv preprint
  year: 2026
  type: preprint
  arxiv: "2608.14798"
  summary: We develop a statistical-mechanical framework for quantum magic based on an efficiently estimable stabilizer partition function and stabilizer work, which continuously connects stabilizer 2-Rényi entropy with stabilizer nullity.
  topics: [quantum-information]

- id: baker2026conversion
  title: Efficient Quantum Circuits for Coherent Conversion Between General First- and Second-Quantized Many-Body Representations
  authors: [J. S. Baker, G. Saxena, T. H. Kyaw]
  venue: arXiv preprint
  year: 2026
  type: preprint
  arxiv: "2606.25029"
  summary: We introduce polynomial-complexity quantum circuits that coherently convert fixed-particle many-body states between first- and second-quantized representations while resolving exchange symmetry for bosons, fermions, and parastatistical sectors.
  topics: [quantum-algorithms]

- id: diezvalle2026pie
  title: Physics-inspired extrapolation for efficient error mitigation and hardware certification
  authors: [P. Díez-Valle, G. Saxena, J. S. Baker, J.-H. Lee, T. H. Kyaw]
  venue: Quantum Science and Technology
  details: "11(2), 025032"
  year: 2026
  type: journal
  doi: 10.1088/2058-9565/ae5555
  arxiv: "2505.07977"
  summary: We develop Physics-Inspired Extrapolation, a low-overhead and low-variance error-mitigation protocol whose fitted slope also quantifies hardware noise through max-relative entropy, and demonstrate it on 84-qubit IBM quantum dynamics.
  topics: [error-mitigation]

- id: casares2026odmr
  title: Quantum algorithms to identify optically detected magnetic resonance-active defects for quantum sensing applications
  authors: [P. A. M. Casares, Y. Zhou, U. Azad, S. Fomichev, J. S. Baker, C. Ling, D. Banerjee, A. Delgado, J. M. Arrazola]
  venue: Physical Review A
  details: "113, 052454"
  year: 2026
  type: journal
  doi: 10.1103/x8gd-fbtr
  arxiv: "2508.13281"
  summary: We propose two quantum algorithms that screen spin defects for optically detected magnetic resonance activity without directly calculating costly intersystem-crossing rates, with resource estimates for the negatively charged boron vacancy in hexagonal boron nitride.
  topics: [quantum-algorithms, materials]

- id: cabral2026multicomponent
  title: Error-Mitigation Enabled Multicomponent Quantum Simulations beyond the Born–Oppenheimer Approximation
  authors: [D. G. A. Cabral, B. Allen, F. Pavošević, S. Hammes-Schiffer, P. Díez-Valle, J. S. Baker, G. Saxena, T. H. Kyaw, V. S. Batista]
  venue: Journal of Chemical Theory and Computation
  details: "22(4), 1760–1769"
  year: 2026
  type: journal
  doi: 10.1021/acs.jctc.5c01911
  arxiv: "2511.11941"
  summary: We introduce a multicomponent unitary coupled-cluster framework and demonstrate the first error-mitigated correlated simulations of coupled electronic and nuclear quantum effects on IBM Heron hardware with ground-state energies within chemical accuracy.
  topics: [quantum-algorithms, error-mitigation]

- id: naranjo2026designing
  title: Designing quantum technologies with a quantum computer
  authors: [J. Naranjo, T. H. Kyaw, G. Saxena, K. Ferreira, J. S. Baker]
  venue: Quantum Science and Technology
  details: "11(3), 035054"
  year: 2026
  type: journal
  doi: 10.1088/2058-9565/ae89de
  arxiv: "2601.22091"
  summary: We develop a quantum-computer-aided framework for simulating and optimizing solid-state spin technologies, combining efficient encodings and Krylov fast-forwarding to model realistic long-time dynamics of the nitrogen-vacancy center in diamond.
  topics: [quantum-algorithms, materials]

- id: baker2025qvr
  title: Quantum Variational Rewinding for Time Series Anomaly Detection
  authors: [J. S. Baker, H. Horowitz, S. K. Radha, S. Fernandes, C. Jones, N. Noorani, V. Skavysh, P. Lamontagne, B. C. Sanders]
